<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Gerenciador de Tarefas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Gerenciador de Tarefas</h1>
  </header>

  <main class="card">
    <h2>Minha Lista de Tarefas</h2>

    <form id="formTask" class="row">
      <input id="taskInput" type="text" placeholder="Digite uma nova tarefa" autocomplete="off" />
      <button id="addBtn" type="submit">Adicionar</button>
    </form>

    <div class="row row-gap">
      <button id="clearDoneBtn" type="button">Limpar concluídas</button>
    </div>

    <ul id="taskList" aria-live="polite"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
